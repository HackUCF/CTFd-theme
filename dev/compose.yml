# Local CTFd for developing/testing this theme. The theme directory is mounted
# live as CTFd/themes/archive, so template edits show up on reload and asset
# changes after `yarn build` (or `yarn dev` for watch mode).
#
#   docker compose -f dev/compose.yml up -d
#   python3 dev/setup.py          # first run: admin account + theme + API token
#
# Data (sqlite DB + uploads) lives in the ctfd-data volume; `down -v` resets it.
#
# To stage a real CTFd export (CTFd can't import into sqlite), use MariaDB like
# production instead:
#
#   export COMPOSE_PROFILES=mariadb
#   export CTFD_DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
#   docker compose -f dev/compose.yml up -d
#   docker cp export.zip ctfd-theme-dev-ctfd-1:/tmp/export.zip
#   docker exec ctfd-theme-dev-ctfd-1 python manage.py import_ctf /tmp/export.zip
#
# Challenge handouts are linked as /files/... and served by the web server, not
# CTFd. The `files` profile adds an nginx front on port 8080 that serves them
# from HANDOUTS_DIR (default: the workspace's publish/challenges) like
# production does, passing everything else through to CTFd.
name: ctfd-theme-dev

services:
  ctfd:
    image: ${CTFD_IMAGE:-ctfd/ctfd:3.8.8}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CTFD_PORT:-8000}:8000"
    environment:
      - SECRET_KEY=theme-dev-not-secret
      # /var/uploads is the only image path owned by the ctfd user, so the
      # volume keeps the sqlite DB there too
      - DATABASE_URL=${CTFD_DATABASE_URL:-sqlite:////var/uploads/ctfd.db}
      - UPLOAD_FOLDER=/var/uploads
      - WORKERS=1
      - ACCESS_LOG=-
      - ERROR_LOG=-
    # CTFd memoizes the theme's static/manifest.json in its cache. Keeping the
    # filesystem cache on tmpfs means `yarn reload` (build + restart) picks up
    # new asset hashes. Template edits need no restart.
    tmpfs:
      - /opt/CTFd/.data:uid=1001,gid=1001
    volumes:
      - ctfd-data:/var/uploads
      - ..:/opt/CTFd/CTFd/themes/archive:ro

  web:
    image: nginx:1.27-alpine
    profiles: [files]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CTFD_FILES_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HANDOUTS_DIR:-../../publish/challenges}:/srv/files:ro

  db:
    image: mariadb:10.11
    profiles: [mariadb]
    restart: unless-stopped
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
    volumes:
      - ctfd-db:/var/lib/mysql

volumes:
  ctfd-data:
  ctfd-db:
