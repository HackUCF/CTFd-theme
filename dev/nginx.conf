# Dev stand-in for the ctf.hackucf.org web server: challenge handouts under
# /files/ come from publish/challenges (written by `pwnmake publish` at the
# workspace root); anything else, including CTFd's own uploads at
# /files/<hash>/<name>, goes to CTFd.
server {
    listen 80;
    client_max_body_size 0;

    location /files/ {
        root /srv;
        try_files $uri @ctfd;
    }

    location / {
        proxy_pass http://ctfd:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @ctfd {
        proxy_pass http://ctfd:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
