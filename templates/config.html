<form>
  <div class="form-group">
    <label>Challenge Window Size</label>
    <select class="form-control custom-select" name="challenge_window_size">
        <option value="sm">Small</option>
        <option value="norm" selected>Normal</option>
        <option value="lg">Large</option>
        <option value="xl">Extra Large</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      Challenge Category Order Custom Function<br>
      <small class="form-text text-muted">
        Define a <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort#description" target="_blank">custom compareFn function for Array.sort()</a> 
        used to sort the challenge categories
      </small>
    </label>
    <textarea class="form-control text-monospace" name="challenge_category_order" rows="5"></textarea>
  </div>

  <div class="form-group">
    <label>
      Challenge Order Custom Function<br>
      <small class="form-text text-muted">
        Define a <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/sort#description" target="_blank">custom compareFn function for Array.sort()</a> 
        used to sort the challenges within categories
      </small>
    </label>
    <textarea class="form-control text-monospace" name="challenge_order" rows="5"></textarea>
  </div>

  <h5 class="mt-4">Archive challenge browser</h5>

  <div class="form-group">
    <label>
      Event Name Template<br>
      <small class="form-text text-muted">
        Label for challenges tagged with a year (e.g. <code>2019</code>). <code>{year}</code> is replaced with the tag.
        Challenges tagged <code>event:&lt;name&gt;</code> use that name instead.
      </small>
    </label>
    <input type="text" class="form-control" name="event_name_template" placeholder="SunshineCTF {year}">
  </div>

  <div class="form-group">
    <label>
      Originals Label<br>
      <small class="form-text text-muted">Tab name for challenges with no year or <code>event:</code> tag.</small>
    </label>
    <input type="text" class="form-control" name="originals_label" placeholder="Hack@UCF Originals">
  </div>

  <div class="form-group">
    <label>Event Tab Order</label>
    <select class="form-control custom-select" name="event_order">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <div class="form-group">
    <label>Originals Tab Position</label>
    <select class="form-control custom-select" name="originals_position">
      <option value="last">After the events</option>
      <option value="first">Before the events</option>
    </select>
  </div>

  <div class="form-group">
    <label>Default Tab</label>
    <select class="form-control custom-select" name="default_event">
      <option value="all">All challenges</option>
      <option value="newest">First event tab</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      Default View<br>
      <small class="form-text text-muted">Players' own choice is remembered in their browser.</small>
    </label>
    <select class="form-control custom-select" name="default_view">
      <option value="board">Board (cards)</option>
      <option value="list">List (table)</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      Category Aliases<br>
      <small class="form-text text-muted">
        One <code>From = To</code> per line to merge category names across events, e.g. <code>RE = Reversing</code>.
      </small>
    </label>
    <textarea class="form-control text-monospace" name="category_aliases" rows="3" placeholder="RE = Reversing"></textarea>
  </div>

  <div>
    <div class="form-check">
      <input type="checkbox" class="form-check-input" id="use_builtin_code_highlighter" name="use_builtin_code_highlighter" checked>
      <label class="form-check-label" for="use_builtin_code_highlighter">
        Use Built-In Syntax Highlighter
      </label>
    </div>
    <small class="form-text text-muted">
      The built-in syntax highlighter is lightweight and fast but may not always correctly highlight all languages. You can disable the built-in highlighter in order to use your own.
    </small>
  </div>

  <button type="submit" class="btn btn-primary float-right mt-4">Update</button>
</form>
